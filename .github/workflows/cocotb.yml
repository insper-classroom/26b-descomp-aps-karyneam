name: Cocotb

on:
  workflow_dispatch: {}
  push:
    paths:
      - .github/workflows/cocotb.yml
      - src/**
      - test/**
      - tools/**
      - programs/**

jobs:
  componentes:
    name: Cocotb / ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: rafaelcorsi/pl-descomp-cocotb:latest
      options: -v ${{ github.workspace }}:/var/www
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ULA
            toplevel: ula
            module: test_ula
          - name: CPU integrado (48 instrucoes)
            toplevel: mips_word_toplevel
            module: test_mips_word_toplevel
          - name: ROM
            toplevel: mips_rom
            module: test_mips_rom
          - name: RAM bytes
            toplevel: mips_ram_bytes
            module: test_mips_ram_bytes
          - name: RAM
            toplevel: mips_ram
            module: test_mips_ram
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Executar teste integrado ou de componente
        run: |
          make -C /var/www/test/ \
            TOPLEVEL=${{ matrix.toplevel }} \
            MODULE=${{ matrix.module }}

  instrucoes:
    name: Cocotb / Instrucao ${{ matrix.instrucao }}
    runs-on: ubuntu-latest
    container:
      image: rafaelcorsi/pl-descomp-cocotb:latest
      options: -v ${{ github.workspace }}:/var/www
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        instrucao:
          - add
          - addi
          - addiu
          - addu
          - and
          - andi
          - beq
          - bgez
          - bgtz
          - blez
          - bltz
          - bne
          - j
          - jal
          - jalr
          - jr
          - lb
          - lbu
          - lh
          - lhu
          - lui
          - lw
          - mfhi
          - mflo
          - mthi
          - mtlo
          - mult
          - multu
          - nor
          - or
          - ori
          - sb
          - sh
          - sll
          - sllv
          - slt
          - slti
          - sltiu
          - sltu
          - sra
          - srav
          - srl
          - srlv
          - sub
          - subu
          - sw
          - xor
          - xori
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Gerar ROM exclusiva para a instrucao
        run: |
          python3 /var/www/tools/build_instruction_test.py "${{ matrix.instrucao }}"
      - name: Executar somente o teste desta instrucao
        run: |
          make -C /var/www/test/ \
            TOPLEVEL=mips_word_toplevel \
            MODULE=test_instr_${{ matrix.instrucao }} \
            MIPS_INDIVIDUAL=1
