
name: Cocotb

on:
  workflow_dispatch: {}
  push:
    paths:
      - .github/workflows/cocotb.yml
      - src/**
      - test/**

jobs:
  cocotb:
    name: Cocotb (${{ matrix.name }})
    runs-on: ubuntu-latest
    container:
      image: rafaelcorsi/pl-descomp-cocotb:latest
      options: -v ${{ github.workspace }}:/var/www

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ULA
            toplevel: ula
            module: test_ula

          - name: CPU smoke test
            toplevel: mips_word_toplevel
            module: test_mips_word_toplevel

          - name: CPU instrucoes C + C+ + B + B+ (48 testes)
            toplevel: mips_word_toplevel
            module: test_mips_instructions

          - name: ROM
            toplevel: mips_rom
            module: test_mips_rom

          - name: RAM bytes
            toplevel: mips_ram_bytes
            module: test_mips_ram_bytes

          - name: RAM
            toplevel: mips_ram
            module: test_mips_ram

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Run cocotb test
        run: |
          make -C /var/www/test/ \
            TOPLEVEL=${{ matrix.toplevel }} \
            MODULE=${{ matrix.module }}
